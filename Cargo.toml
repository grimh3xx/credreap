[package]
name = "credreap"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["grimh3xx"]
description = "credreap — lockout-aware credential spraying + hash-cracking orchestrator for authorized engagements"
repository = "https://github.com/grimh3xx/credreap"
license = "MIT"
keywords = ["security", "pentest", "password-spraying", "hashcat", "credentials"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "credreap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
rand = "0.8"
regex = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
